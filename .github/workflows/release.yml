name: Release

# Builds Canine Connect and attaches it to a GitHub release. Canine's download page links to the latest release.
# Release by bumping CFBundleShortVersionString in Resources/Info.plist, then: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$plist_version" != "$tag_version" ]]; then
            echo "Tag says $tag_version but Info.plist says $plist_version" >&2
            exit 1
          fi

      - name: Build Apple Silicon
        run: ARCH=arm64 script/build.sh --zip

      - name: Build Intel
        run: ARCH=x86_64 script/build.sh --zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Canine Connect ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/CanineConnect-macos-arm64.zip dist/CanineConnect-macos-x86_64.zip --clobber
